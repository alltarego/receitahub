<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReceitaHub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <span class="logo">ReceitaHub</span>
    <button class="btn-add">+ Add</button>
  </header>

  <main class="container">

    <!-- FILTROS -->
    <div class="filtros">
      <button class="filtro active">Todos</button>
      <button class="filtro">Frango</button>
      <button class="filtro">Massas</button>
      <button class="filtro">Saladas</button>
      <button class="filtro">Carnes</button>
    </div>

    <!-- MINHAS RECEITAS -->
    <section>
      <h2 class="section-title">Minhas Receitas</h2>
      <div class="cards-grid" id="cardsGrid"></div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
