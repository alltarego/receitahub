<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReceitaHub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <span class="logo">ReceitaHub</span>
    <button class="btn-add">+ Add</button>
  </header>

  <main class="container">

    <!-- FILTROS -->
    <div class="filtros">
      <button class="filtro active">Todos</button>
      <button class="filtro">Frango</button>
      <button class="filtro">Massas</button>
      <button class="filtro">Saladas</button>
      <button class="filtro">Carnes</button>
    </div>

    <!-- MINHAS RECEITAS -->
    <section>
      <h2 class="section-title">Minhas Receitas</h2>
      <div class="cards-grid">

        <div class="card">
          <div class="card-img">[img]</div>
          <div class="card-body">
            <p class="card-categoria">Frango</p>
            <h3 class="card-nome">Frango Grelhado</h3>
            <p class="card-info">&#128336; 30 min &nbsp; &#128101; 4</p>
            <div class="card-actions">
              <button class="btn-editar">Editar</button>
              <button class="btn-deletar">Deletar</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-img">[img]</div>
          <div class="card-body">
            <p class="card-categoria">Massas</p>
            <h3 class="card-nome">Espaguete à Carbonara</h3>
            <p class="card-info">&#128336; 25 min &nbsp; &#128101; 2</p>
            <div class="card-actions">
              <button class="btn-editar">Editar</button>
              <button class="btn-deletar">Deletar</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-img">[img]</div>
          <div class="card-body">
            <p class="card-categoria">Saladas</p>
            <h3 class="card-nome">Salada Caesar</h3>
            <p class="card-info">&#128336; 15 min &nbsp; &#128101; 2</p>
            <div class="card-actions">
              <button class="btn-editar">Editar</button>
              <button class="btn-deletar">Deletar</button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
